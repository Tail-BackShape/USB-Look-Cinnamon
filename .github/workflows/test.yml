name: Unit tests
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate xlet syntax and JSON
        run: npm run check
      - name: Run unit and mocked integration tests
        run: npm test
      - name: Validate installer syntax
        run: sh -n scripts/install-local.sh
